version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # Major updates often include breaking changes (for example, @astrojs/check only
      # supports TypeScript 5 and 6). Upgrade majors by hand when you are ready.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # package.json "overrides" forces rehype-katex onto this KaTeX version, which is newer
      # than it declares. Upgrade KaTeX by hand and check that formulas still look right.
      - dependency-name: katex
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
